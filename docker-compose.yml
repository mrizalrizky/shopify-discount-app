services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: salecodes
      POSTGRES_PASSWORD: salecodes
      POSTGRES_DB: salecodes
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata: {}
